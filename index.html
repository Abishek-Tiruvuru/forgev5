<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forge" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Forge — Gym Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; overscroll-behavior: none; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #080808; color: #f0f0f0;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  input, button, textarea { font-family: inherit; user-select: text; -webkit-user-select: text; }
  button { cursor: pointer; border: none; background: none; color: inherit; }

  :root {
    /* Refined monochrome base */
    --bg:         #080808;
    --surface:    rgba(255,255,255,0.04);
    --surface-2:  rgba(255,255,255,0.07);
    --surface-3:  rgba(255,255,255,0.10);
    --border:     rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text:       #f0f0f0;
    --text-2:     #8a8a8a;
    --text-3:     #444444;
    /* Surgical red */
    --accent:     #e5372a;
    --accent-dim: rgba(229,55,42,0.10);
    --accent-glow: rgba(229,55,42,0.22);
    /* Semantic */
    --success:    #34d399;
    --success-dim: rgba(52,211,153,0.08);
    --danger:     #e5372a;
    --info:       #818cf8;
    --gold:       #fbbf24;
    --surface-lowest: #040404;
    --on-accent:  #ffffff;
    --pink:       #ec4899;
    /* Glass surfaces */
    --glass:      rgba(255,255,255,0.05);
    --glass-dark: rgba(0,0,0,0.35);
    --glass-border: rgba(255,255,255,0.10);
  }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }
  .screen { padding: 1.5rem 1.2rem 7rem; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; font-family: 'Lexend', sans-serif; text-transform: uppercase; line-height: 1.15; }
  h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.005em; font-family: 'Lexend', sans-serif; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-3); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .muted { color: var(--text-2); }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; }

  .card {
    background: rgba(255,255,255,0.045);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px; padding: 1.1rem 1.25rem;
    transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
    box-shadow: 0 1px 1px rgba(255,255,255,0.04) inset, 0 8px 32px rgba(0,0,0,0.28);
  }
  .card:hover { border-color: rgba(255,255,255,0.15); box-shadow: 0 1px 1px rgba(255,255,255,0.05) inset, 0 12px 40px rgba(0,0,0,0.35); }
  .card.elevated {
    background: linear-gradient(145deg, rgba(255,255,255,0.065) 0%, rgba(255,255,255,0.025) 100%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.04) inset, 0 8px 32px rgba(0,0,0,0.35);
  }
  .card.accent {
    background: linear-gradient(135deg, #e5372a 0%, #c0281d 100%);
    border: 1px solid rgba(255,150,140,0.2);
    color: #fff;
    box-shadow: 0 4px 24px rgba(229,55,42,0.35), 0 1px 1px rgba(255,180,170,0.15) inset;
  }
  .card.success { background: linear-gradient(135deg, #059669, #047857); border: none; color: #ecfdf5; box-shadow: 0 4px 20px rgba(5,150,105,0.25); }
  .card.info    { background: linear-gradient(135deg, #4f46e5, #4338ca); border: none; color: #eef2ff; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 22px; border-radius: 14px; font-weight: 700; font-size: 13px;
    font-family: 'Inter', sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
    background: linear-gradient(135deg, #e5372a 0%, #c9291d 100%);
    color: #fff;
    border: 1px solid rgba(255,140,130,0.18);
    box-shadow: 0 4px 20px rgba(229,55,42,0.28), 0 1px 1px rgba(255,180,160,0.12) inset;
    transition: transform 0.15s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s; width: 100%;
  }
  .btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(229,55,42,0.2); }
  .btn:hover:not(:disabled) { box-shadow: 0 6px 28px rgba(229,55,42,0.4), 0 1px 1px rgba(255,180,160,0.15) inset; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.28; box-shadow: none; pointer-events: none; }
  .btn.ghost {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--text); box-shadow: none;
    border: 1px solid rgba(255,255,255,0.09);
  }
  .btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.16); }
  .btn.outline {
    background: transparent; color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); box-shadow: none;
  }
  .btn.outline:hover:not(:disabled) { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
  .btn.danger { background: rgba(229,55,42,0.1); color: var(--accent); border: 1px solid rgba(229,55,42,0.25); box-shadow: none; }
  .btn-sm { padding: 9px 16px; font-size: 11px; border-radius: 10px; box-shadow: none; }

  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--text-2);
    border: 1px solid rgba(255,255,255,0.09); transition: all 0.2s;
  }
  .pill.active {
    background: linear-gradient(135deg, rgba(229,55,42,0.9), rgba(180,40,30,0.9));
    color: #fff; border-color: rgba(255,120,110,0.25);
    box-shadow: 0 2px 12px rgba(229,55,42,0.25);
  }
  .pill:active { transform: scale(0.95); }
  .pill:hover { border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.09); }
  .pill.success.active { background: linear-gradient(135deg, rgba(5,150,105,0.85), rgba(4,120,87,0.85)); border-color: rgba(52,211,153,0.3); color: #ecfdf5; }
  .pill.danger.active { background: linear-gradient(135deg, rgba(229,55,42,0.85), rgba(180,40,30,0.85)); border-color: rgba(229,55,42,0.3); color: #fff; }

  .input, .number-input, textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    color: var(--text);
    padding: 11px 14px;
    font-size: 14px; font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: none;
  }
  .input:focus, .number-input:focus, textarea:focus {
    outline: none;
    border-color: rgba(229,55,42,0.5);
    box-shadow: 0 0 0 3px rgba(229,55,42,0.10), 0 4px 16px rgba(0,0,0,0.2);
  }

  input[type=range] { -webkit-appearance: none; width: 100%; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.08); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 0 3px rgba(229,55,42,0.25), 0 2px 8px rgba(0,0,0,0.4); border: 2px solid rgba(229,55,42,0.6); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid rgba(229,55,42,0.6); cursor: pointer; box-shadow: 0 0 0 3px rgba(229,55,42,0.2); }

  .progress { height: 4px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #e5372a, #ff6b5e); border-radius: 999px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 8px rgba(229,55,42,0.4); }
  .progress.water > div { background: linear-gradient(90deg, #818cf8, #a5b4fc); box-shadow: 0 0 8px rgba(129,140,248,0.4); }
  .progress.xp > div { background: linear-gradient(90deg, #e5372a 0%, #fbbf24 100%); box-shadow: 0 0 10px rgba(229,55,42,0.35); }
  .progress.cardio > div { background: linear-gradient(90deg, #ec4899, #f472b6); box-shadow: 0 0 8px rgba(236,72,153,0.35); }

  .step-dots { display: flex; gap: 4px; margin-bottom: 2rem; }
  .step-dots > div { flex: 1; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.1); transition: background 0.4s, transform 0.3s; }
  .step-dots > div.active { background: rgba(255,255,255,0.85); transform: scaleY(1.5); }

  .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-family: 'Inter', sans-serif; font-weight: 600; margin-bottom: 1.25rem; transition: color 0.2s, gap 0.2s; padding: 6px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 999px; }
  .back-btn:hover { color: var(--text); gap: 10px; background: rgba(255,255,255,0.08); }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px 12px; transition: border-color 0.2s; }
  .stat:hover { border-color: rgba(255,255,255,0.15); }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-3); margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .stat-value { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; font-family: 'JetBrains Mono', monospace; }
  .stat-unit { font-size: 11px; color: var(--text-3); margin-left: 2px; font-weight: 400; font-family: 'JetBrains Mono', monospace; }

  .rank-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  /* ============ WORKOUT UI — minimal, stepper-only ============ */
  .set-row {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08); padding: 12px 14px; border-radius: 16px;
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
  }
  .set-row.active {
    border-color: rgba(229,55,42,0.45); background: rgba(229,55,42,0.07);
    box-shadow: 0 0 0 1px rgba(229,55,42,0.12) inset, 0 6px 20px rgba(0,0,0,0.25);
  }
  .set-row.done { border-color: rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); opacity: 0.5; }
  .set-num {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,0.07); color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.25s;
  }
  .set-row.active .set-num { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 0 12px rgba(229,55,42,0.45); }
  .set-row.done .set-num { background: rgba(52,211,153,0.12); color: var(--success); border-color: rgba(52,211,153,0.2); }

  /* Big stepper buttons */
  .stepper-block { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
  .stepper-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-3); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .stepper-val { font-size: 20px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--text); letter-spacing: -0.03em; min-width: 62px; text-align: center; transition: color 0.2s; }
  .stepper-btns { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
  .step-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); font-size: 20px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s; flex-shrink: 0;
  }
  .step-btn:active { transform: scale(0.88); background: var(--surface-3); color: var(--text); }

  /* Rest timer ring */
  .rest-ring-wrap {
    position: fixed; inset: 0; background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 90;
  }
  .rest-ring-svg { width: 200px; height: 200px; transform: rotate(-90deg); }
  .rest-label { font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 800; margin-top: -168px; color: #ffffff; letter-spacing: -0.04em; }
  .rest-sublabel { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.2em; margin-top: 4px; }

  /* History chips */
  .hist-chip { display: inline-flex; flex-direction: column; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; }

  /* Big done button */
  .btn-done {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 18px 20px; border-radius: 16px; font-weight: 800; font-size: 16px;
    font-family: 'Lexend', sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--accent); color: #fff; width: 100%;
    box-shadow: 0 0 16px var(--accent-glow);
    transition: transform 0.12s, box-shadow 0.2s;
  }
  .btn-done:active { transform: scale(0.96); box-shadow: none; }
  .btn-done:disabled { opacity: 0.4; box-shadow: none; pointer-events: none; }

  .field-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .field-input {
    background: transparent; border: none; color: var(--text);
    font-size: 16px; font-weight: 600; width: 100%; padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .field-input:focus { outline: none; border-bottom-color: var(--accent); }

  /* Spotify removed */

  .reminder {
    position: fixed; bottom: 16px; left: 16px; right: 16px;
    max-width: 448px; margin: 0 auto;
    background: rgba(12,12,12,0.88);
    backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
    color: white;
    border: 1px solid rgba(255,255,255,0.11);
    border-radius: 20px; padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.55), 0 1px 1px rgba(255,255,255,0.04) inset;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  @keyframes slideUp { from { transform: translateY(120%); } to { transform: translateY(0); } }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 24px; animation: fade 0.25s;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: rgba(14,14,14,0.92);
    backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 2px 2px rgba(255,255,255,0.04) inset, 0 24px 80px rgba(0,0,0,0.6);
    border-radius: 28px; padding: 32px 24px;
    max-width: 360px; width: 100%; text-align: center;
    animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .modal.left-aligned { text-align: left; padding: 24px 20px; }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .rank-icon-big {
    width: 96px; height: 96px; margin: 0 auto 16px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 40% 35%, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 1px 1px rgba(255,255,255,0.08) inset;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    animation: rankPulse 3s ease-in-out infinite;
  }
  @keyframes rankPulse {
    0%,100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 0 rgba(229,55,42,0); }
    50% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 8px rgba(229,55,42,0.07); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 60px rgba(249, 115, 22, 0.5); }
    50% { box-shadow: 0 0 100px rgba(251, 191, 36, 0.7); }
  }

  .quest {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 14px 16px; border-radius: 16px; transition: border-color 0.2s, background 0.2s;
  }
  .quest:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
  .quest.done { background: rgba(229,55,42,0.06); border-color: rgba(229,55,42,0.2); }
  .quest-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 12px; transition: all 0.3s;
    font-family: 'JetBrains Mono', monospace;
  }
  .quest.done .quest-check { background: rgba(229,55,42,0.15); border-color: rgba(229,55,42,0.5); color: var(--accent); }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; }
  .confetti span { position: absolute; width: 8px; height: 8px; animation: confetti-fall 2.5s linear forwards; }
  @keyframes confetti-fall {
    0% { transform: translateY(-20vh) rotate(0); opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-width: 480px; margin: 0 auto;
    background: rgba(6,6,6,0.82);
    backdrop-filter: blur(32px) saturate(200%); -webkit-backdrop-filter: blur(32px) saturate(200%);
    border-top: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 -1px 0 rgba(255,255,255,0.04) inset;
    padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px);
    display: flex; justify-content: space-around; z-index: 50;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; color: var(--text-3); font-size: 9px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    transition: color 0.2s, transform 0.15s;
    position: relative;
  }
  .nav-btn.active { color: var(--accent); }

    FOOD_INDEX[item.name.toLowerCase()] = item;
  });

};

// Quantity parser — turns "2 rotis" / "half cup rice" / "100g paneer" into structured data
const NUM_WORDS = {
  "half": 0.5, "quarter": 0.25, "one": 1, "two": 2, "three": 3, "four": 4,
  "five": 5, "six": 6, "seven": 7, "eight": 8, "nine": 9, "ten": 10,
  "a": 1, "an": 1, "few": 3, "couple": 2, "double": 2,
};
const FRACTION = { "1/2": 0.5, "1/4": 0.25, "3/4": 0.75, "1/3": 0.33, "2/3": 0.67 };

const parseQty = (text) => {
  const t = text.trim().toLowerCase();
  let qty = null, unit = null, rest = t;

  // Match leading number: "2.5", "100", "1/2"
  const numMatch = rest.match(/^(\d+\.?\d*|\d+\/\d+)\s*/);
  if (numMatch) {
    const raw = numMatch[1];
    qty = FRACTION[raw] !== undefined ? FRACTION[raw] : parseFloat(raw);
    rest = rest.slice(numMatch[0].length);
  } else {
    // Match leading word like "half", "two", "a"
    const w = rest.match(/^(\w+)\s+/);
    if (w && NUM_WORDS[w[1]] !== undefined) {
      qty = NUM_WORDS[w[1]];
      rest = rest.slice(w[0].length);
    }
  }

  // Unit overrides — "100g", "200 grams", "1 cup", "1 plate", "small", "big"
  // Require word boundary or end-of-string after unit, so "gulab" doesn't match "g".
  // Also: gram units only fire if a number was already parsed, otherwise "g..." anything matches.
  const unitMatch = rest.match(/^(g|gm|gms|grams?|ml|cup|cups|plate|plates|piece|pieces|pcs|bowl|bowls|glass|glasses|tbsp|tsp|tablespoons?|teaspoons?|small|medium|large|big|half|full)(\s+|$)/);
  if (unitMatch) {
    const u = unitMatch[1];
    const isGram = ["g","gm","gms","gram","grams"].includes(u);
    const isMl = u === "ml";
    // Gram/ml units only valid if we already parsed a number (else "g" in standalone words would match)
    if ((isGram || isMl) && qty == null) {
      // skip — leave rest alone
    } else if (isGram) {
      unit = "100g";
      if (qty) qty = qty / 100;
      rest = rest.slice(unitMatch[0].length);
    } else if (isMl) {
      unit = "cup";
      if (qty) qty = qty / 250;
      rest = rest.slice(unitMatch[0].length);
    } else {
      if (["cup","cups"].includes(u)) unit = "cup";
      else if (["plate","plates"].includes(u)) unit = "plate";
      else if (["piece","pieces","pcs"].includes(u)) unit = "piece";
      else if (["bowl","bowls"].includes(u)) unit = "cup";
      else if (["glass","glasses"].includes(u)) unit = "glass";
      else if (["tbsp","tablespoon","tablespoons"].includes(u)) unit = "tbsp";
      else if (["tsp","teaspoon","teaspoons"].includes(u)) unit = "tsp";
      else if (u === "small") { qty = (qty || 1) * 0.7; }
      else if (u === "medium") { qty = qty || 1; }
      else if (["large","big"].includes(u)) { qty = (qty || 1) * 1.3; }
      else if (u === "half") qty = 0.5;
      else if (u === "full") qty = 1;
      rest = rest.slice(unitMatch[0].length);
    }
  }

  rest = rest.replace(/^of\s+/, "");
  return { qty: qty == null ? 1 : qty, unit, rest: rest.trim() };
};

// Match user text against food DB — returns best match or null
const matchFood = (query) => {
  const q = query.toLowerCase().trim();
  if (!q) return null;

  // 1) Exact alias match
  if (FOOD_INDEX[q]) return FOOD_INDEX[q];

  // 2) Singularize: try removing trailing 's' or 'es'
  if (q.endsWith("s") && FOOD_INDEX[q.slice(0,-1)]) return FOOD_INDEX[q.slice(0,-1)];
  if (q.endsWith("es") && FOOD_INDEX[q.slice(0,-2)]) return FOOD_INDEX[q.slice(0,-2)];

  // 3) Word-boundary match — alias appears as whole word(s) in query (handles "gulab jamun" not matching "jam")
  let best = null; let bestLen = 0;
  for (const [alias, item] of Object.entries(FOOD_INDEX)) {
    if (alias.length < 3) continue;
    // Build word-boundary regex
    const re = new RegExp(`\\b${alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i");
    if (re.test(q) && alias.length > bestLen) {
      best = item; bestLen = alias.length;
    }
  }
  if (best) return best;

  // 4) Loose: query starts with alias or alias starts with query
  for (const [alias, item] of Object.entries(FOOD_INDEX)) {
    if (alias.length < 3) continue;
    if (q.startsWith(alias) && alias.length > bestLen) { best = item; bestLen = alias.length; }
    else if (alias.startsWith(q) && q.length > 2 && q.length > bestLen) { best = item; bestLen = q.length; }
  }
  return best;
};

// Search foods for typeahead — returns list of items matching query
const searchFoods = (query, limit = 8) => {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const results = []; const seen = new Set();
  // Build combined list — custom foods first (user's own), then DB
  let customs = [];
  try { customs = (state && state.customFoods) || []; } catch { customs = []; }
  const customAsItems = customs.map(c => ({
    name: c.name, unit: c.unit || "serving",
    kcal: c.kcal, p: c.p || 0, c: c.c || 0, f: c.f || 0,
    aliases: [c.name.toLowerCase()], _custom: true, _id: c.id,
  }));
  const allItems = [...customAsItems, ...FOOD_DB];
  // 1) exact + starts-with
  for (const item of allItems) {
    if (seen.has(item.name)) continue;
    const lower = item.name.toLowerCase();
    if (lower.startsWith(q) || (item.aliases || []).some(a => a.startsWith(q))) {
      results.push(item); seen.add(item.name);
      if (results.length >= limit) return results;
    }
  }
  // 2) contains
  for (const item of allItems) {
    if (seen.has(item.name)) continue;
    const lower = item.name.toLowerCase();
    if (lower.includes(q) || (item.aliases || []).some(a => a.includes(q))) {
      results.push(item); seen.add(item.name);
      if (results.length >= limit) return results;
    }
  }
  return results;
};

// Parse a full input like "2 rotis with dal and 1 banana" into items
const parseFoodInput = (input) => {
  // Split by commas, "and", "with", "+", newlines, "&"
  const chunks = input.split(/,|\sand\s|\swith\s|\+|\n|&/i).map(c => c.trim()).filter(c => c);
  const results = [];
  for (const chunk of chunks) {
    const parsed = parseQty(chunk);
    if (!parsed.rest) continue;
    const food = matchFood(parsed.rest);
    if (food) {
      const unitToShow = parsed.unit || food.unit;
      const mult = parsed.qty;
      results.push({
        name: food.name,
        qty: formatQty(parsed.qty, unitToShow),
        kcal: Math.round(food.kcal * mult),
        protein: +(food.p * mult).toFixed(1),
        carbs: +(food.c * mult).toFixed(1),
        fat: +(food.f * mult).toFixed(1),
        _ref: food, _mult: mult,
      });
    } else {
      results.push({ name: chunk, qty: "?", kcal: 0, protein: 0, carbs: 0, fat: 0, unmatched: true });
    }
  }
  return results;
};

const formatQty = (qty, unit) => {
  let u = unit;
  if (unit === "piece") u = qty === 1 ? "pc" : "pcs";
  if (qty < 1 && qty > 0) {
    if (Math.abs(qty - 0.5) < 0.01) return "½ " + u;
    if (Math.abs(qty - 0.25) < 0.01) return "¼ " + u;
    if (Math.abs(qty - 0.75) < 0.01) return "¾ " + u;
    if (Math.abs(qty - 0.33) < 0.01) return "⅓ " + u;
    if (Math.abs(qty - 0.67) < 0.01) return "⅔ " + u;
    return qty.toFixed(2) + " " + u;
  }
  return (qty % 1 === 0 ? qty : qty.toFixed(1)) + " " + u;
};

  return { current, next, progress: next ? (xp - current.min) / (next.min - current.min) : 1 };
};

const handleGoogleCredential = async (response) => {
  try {
    // Decode JWT payload (no library needed — it's base64)
    const payload = JSON.parse(atob(response.credential.split(".")[1]));
    gauth.user = { name: payload.name, email: payload.email, picture: payload.picture };
    // Get access token for Drive API using OAuth2 token request
    await requestDriveToken();
  } catch (e) {
    console.warn("Google auth error:", e);
  }
};

const requestDriveToken = () => {
  if (!GOOGLE_CLIENT_ID) return Promise.reject("No client ID");
  return new Promise((resolve, reject) => {
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email",
      callback: async (tokenResponse) => {
        if (tokenResponse.error) { reject(tokenResponse.error); return; }
        gauth.token = tokenResponse.access_token;
        gauth.exp = Date.now() + (tokenResponse.expires_in - 60) * 1000;
        // Cache for session
        localStorage.setItem(GAUTH_KEY, JSON.stringify({
          token: gauth.token, exp: gauth.exp,
          user: gauth.user, driveFileId: gauth.driveFileId,
        }));
        // Load from Drive on first sign-in
        await driveSyncLoad();
        resolve();
      },
    });
    client.requestAccessToken();
  });
};

// ---- Google Drive API helpers ----
const driveAPI = async (endpoint, options = {}) => {
  if (!gauth.token) throw new Error("Not authenticated");
  const res = await fetch(`https://www.googleapis.com/drive/v3/${endpoint}`, {
    ...options,
    headers: { Authorization: `Bearer ${gauth.token}`, ...(options.headers || {}) },
  });
  if (res.status === 401) { gauth.token = null; throw new Error("Token expired"); }
  if (!res.ok) throw new Error(`Drive API ${res.status}`);
  return res.json().catch(() => ({}));
};

const driveUpload = async (fileId, data) => {
  const body = JSON.stringify(data);
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  if (fileId) {
    const res = await fetch(url, {
      method: "PATCH",
      headers: { Authorization: `Bearer ${gauth.token}`, "Content-Type": "application/json" },
      body,
    });
    if (!res.ok) throw new Error(`Drive upload ${res.status}`);
    return res.json();
  } else {
    // Create new file in appDataFolder
    const meta = JSON.stringify({ name: DRIVE_FILE_NAME, parents: ["appDataFolder"] });
    const formData = new FormData();
    formData.append("metadata", new Blob([meta], { type: "application/json" }));
    formData.append("file", new Blob([body], { type: "application/json" }));
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { Authorization: `Bearer ${gauth.token}` },
      body: formData,
    });
    if (!res.ok) throw new Error(`Drive create ${res.status}`);
    return res.json();
  }
};

// Save state → Drive
const driveSyncSave = async () => {
  if (!gauth.token || gauth.syncing) return;
  gauth.syncing = true;
  try {
    // Find or use cached file ID
    if (!gauth.driveFileId) {
      const list = await driveAPI(`files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id)`);
      gauth.driveFileId = list.files?.[0]?.id || null;
    }
    const res = await driveUpload(gauth.driveFileId, state);
    if (!gauth.driveFileId) {
      gauth.driveFileId = res.id;
      localStorage.setItem(GAUTH_KEY, JSON.stringify({
        token: gauth.token, exp: gauth.exp,
        user: gauth.user, driveFileId: gauth.driveFileId,
      }));
    }
    gauth.lastSync = Date.now();
  } catch (e) {
    console.warn("Drive save failed:", e);
  } finally {
    gauth.syncing = false;
  }
};

// Load state ← Drive (on sign-in)
const driveSyncLoad = async () => {
  if (!gauth.token) return;
  try {
    // Find file
    const list = await driveAPI(`files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id,modifiedTime)`);
    const file = list.files?.[0];
    if (!file) {
      // No Drive data yet — push local state up
      await driveSyncSave();
      showToast("Drive connected — data synced", "success");
      render();
      return;
    }
    gauth.driveFileId = file.id;
    // Download
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
      headers: { Authorization: `Bearer ${gauth.token}` },
    });
    const driveData = await res.json();
    // Merge: use Drive data as base, but keep local if Drive is empty
    if (driveData && driveData.xp !== undefined) {
      state = { ...defaultData, ...driveData };

const calcBodyFat = ({ weight, height, age, sex = "male" }) => {
  const bmi = weight / Math.pow(height / 100, 2);
  const sexFactor = sex === "male" ? 1 : 0;
  const bf = 1.2 * bmi + 0.23 * age - 10.8 * sexFactor - 5.4;
  return Math.max(5, Math.min(45, Math.round(bf)));
};

// Mifflin-St Jeor
const calcBMR = ({ weight, height, age, sex }) => {
  const base = 10 * weight + 6.25 * height - 5 * age;
  return Math.round(sex === "male" ? base + 5 : base - 161);
};

const calcTDEE = (profile) => {
  const bmr = calcBMR(profile);
  // Activity from training freq + assumed light daily activity
  const activity = 1.3 + (profile.frequency * 0.05);
  return Math.round(bmr * activity);
};

const calcTargetCalories = (profile) => {
  const tdee = calcTDEE(profile);
  const goal = GOALS.find(g => g.id === profile.goal) || GOALS[1];
  return Math.round(tdee * (1 + goal.calMod));
};

const calcMacroTargets = (profile) => {
  const target = calcTargetCalories(profile);
  const goal = GOALS.find(g => g.id === profile.goal) || GOALS[1];
  const proteinG = Math.round(profile.weight * goal.proteinPerKg);
  const fatG = Math.round((target * 0.25) / 9);
  const carbG = Math.round((target - proteinG * 4 - fatG * 9) / 4);
  return { kcal: target, protein: proteinG, carbs: Math.max(50, carbG), fat: fatG };
};

// Which muscle groups each day type trains
const DAY_GROUPS = {
  Push:  ["Chest", "Shoulders", "Arms"],
  Pull:  ["Back", "Arms"],
  Legs:  ["Legs", "Core"],
  Upper: ["Chest", "Back", "Shoulders", "Arms"],

const generateSplit = (intensityId = null) => {
  if (state.customSplit) return state.customSplit;
  const { selectedMuscles, frequency, weakMuscles, goal, splitType = "UL" } = state.profile;
  const goalData = GOALS.find(g => g.id === goal) || GOALS[1];

  // Use provided intensity or fall back to today's saved intensity or moderate
  const lvl = INTENSITY_LEVELS.find(l => l.id === (intensityId || state.todayIntensity)) || INTENSITY_LEVELS[1];

  // Resolve template key
  const key = `${splitType}-${frequency}`;
  const fallbackKey = Object.keys(SPLIT_TEMPLATES).find(k => k.endsWith(`-${frequency}`)) || "UL-4";
  const template = SPLIT_TEMPLATES[key] || SPLIT_TEMPLATES[fallbackKey];

  return template.map((dayType, idx) => {
    const day = { name: dayType, idx, exercises: [], intensity: lvl.id };
    const groups = DAY_GROUPS[dayType] || [];
    let totalExercises = 0;
    const [minEx, maxEx] = lvl.totalExRange;

    groups.forEach(group => {
      const isSelected = selectedMuscles.some(s => s.startsWith(group));
      if (!isSelected) return;
      if (totalExercises >= maxEx) return; // cap total exercises
      const isWeak = weakMuscles.some(w => w.startsWith(group));
      const exList = (DEFAULT_SPLIT_EX[group] || []).filter(e => !state.excludedExercises.includes(e));
      // Scale exercises per group by intensity
      const baseNum = dayType === "Full" ? 1 : isWeak ? lvl.exPerGroup + 1 : lvl.exPerGroup;
      const numEx = Math.min(baseNum, exList.length, maxEx - totalExercises);
      const picks = exList.slice(0, numEx);
      picks.forEach(name => {
        day.exercises.push({
          name, group,
          sets: lvl.setsPerEx,
          targetReps: lvl.repRange,
          rest: lvl.restSecs + "s",
          isPriority: isWeak,
          intensityMult: lvl.weightMult,
        });
        totalExercises++;
      });
    });

    // Ensure minimum exercises even on sparse muscle selection
    // by re-adding from any group if below minimum
    if (day.exercises.length < minEx) {
      groups.forEach(group => {
        if (day.exercises.length >= minEx) return;
        const exList = (DEFAULT_SPLIT_EX[group] || []).filter(e =>
          !state.excludedExercises.includes(e) &&
          !day.exercises.find(ex => ex.name === e)
        );
        if (exList[0]) {
          day.exercises.push({
            name: exList[0], group,
            sets: lvl.setsPerEx,
            targetReps: lvl.repRange,
            rest: lvl.restSecs + "s",
            isPriority: false,
            intensityMult: lvl.weightMult,
          });
        }
      });
    }

    return day;
  });
};

const suggestNextWeight = (history, exerciseName) => {
  const sessions = history.filter(h => h.exercise === exerciseName);
  if (sessions.length === 0) return { weight: null, change: 0, msg: "Start light & build up" };
  const last = sessions[sessions.length - 1];
  const avgRIR = last.sets.reduce((a, s) => a + (s.rir || 0), 0) / last.sets.length;
  const avgReps = last.sets.reduce((a, s) => a + s.reps, 0) / last.sets.length;
  const lastWeight = last.sets.reduce((a, s) => a + s.weight, 0) / last.sets.length;
  const targetTop = parseInt(last.targetReps?.split("-")[1] || "10");
  let change = 0; let msg = "";
  if (avgRIR >= 2 && avgReps >= targetTop) {
    change = 2.5;
    msg = "Hit target with reps in reserve — go up!";
  } else if (avgRIR <= 0 && avgReps < parseInt(last.targetReps?.split("-")[0] || "8")) {
    change = -2.5;
    msg = "Below target & at failure — drop slightly";
  } else { msg = "Stay here, push for more reps"; }
  return { weight: Math.max(0, lastWeight + change), change, msg, lastWeight };
};

// ============ PROJECTIONS ============
// Project weight loss / gain over next 60 days based on calorie balance
const projectWeight = (days = 60) => {
  const profile = state.profile;
  const target = calcTargetCalories(profile);
  const tdee = calcTDEE(profile);
  const dailyDeficit = target - tdee; // negative = loss
  // 7700 kcal ≈ 1kg fat
  const kgPerDay = dailyDeficit / 7700;
  const points = [];
  let w = profile.weight;
  // adjust based on actual body log if present
  const log = (state.bodyLog || []).slice(-10);
  if (log.length >= 2) {
    const span = (log[log.length-1].date - log[0].date) / 86400000;
    const actualKgPerDay = span > 0 ? (log[log.length-1].weight - log[0].weight) / span : kgPerDay;
    // blend predicted with actual
    const blended = (kgPerDay * 0.4 + actualKgPerDay * 0.6);
    for (let i = 0; i <= days; i++) points.push({ day: i, weight: +(w + blended * i).toFixed(2) });
  } else {
    for (let i = 0; i <= days; i++) points.push({ day: i, weight: +(w + kgPerDay * i).toFixed(2) });
  }
  return points;
};

// Project muscle gain — based on training volume + protein adequacy + experience
const projectMuscle = (days = 60) => {
  const profile = state.profile;
  const goal = GOALS.find(g => g.id === profile.goal) || GOALS[1];
  // Beginner: ~0.5kg/month muscle. Intermediate: ~0.25kg. Lyle McDonald model.
  const sessionsTotal = state.history.length / 6; // approx workouts
  let monthlyGain = 0.6; // beginner
  if (sessionsTotal > 50) monthlyGain = 0.35;
  if (sessionsTotal > 200) monthlyGain = 0.15;
  // surplus boost
  if (goal.calMod > 0) monthlyGain *= 1.3;
  if (goal.calMod < -0.15) monthlyGain *= 0.5;
  // gender
  if (profile.sex === "female") monthlyGain *= 0.6;
  const dailyGain = monthlyGain / 30;
  const points = [];
  for (let i = 0; i <= days; i++) points.push({ day: i, kg: +(dailyGain * i).toFixed(3) });
  return points;
};

    clearInterval(setTimerInterval);
    setTimerInterval = null;
  }
  $app.querySelectorAll(".reminder, .modal-bg, .confetti, .toast, .sheet").forEach(el => el.remove());
  const splash = $app.querySelector(".splash");
  if (splash) splash.remove();

  if (!state.profile) return renderOnboarding();
  ensureQuestsForToday();

  // Scroll to top on screen change for clean entry
  window.scrollTo({ top: 0, behavior: "instant" });

  const screens = {
    home: renderHome,
    workout: renderWorkout,
    split: renderSplit,
    progress: renderProgress,
    quests: renderQuests,
    settings: renderSettings,
    cardio: renderCardio,
    food: renderFood,
    fuel: renderFuel,
    hydration: renderHydration,
    projections: renderProjections,
  };
  (screens[view] || renderHome)();
};

  const todayDay = new Date().getDay();
  const todayPlan = split[todayDay % split.length];
  const sessionsThisWeek = state.history.filter(h => Date.now() - h.date < 7 * 86400000)
    .reduce((acc, h) => { const d = new Date(h.date).toDateString(); if (!acc.includes(d)) acc.push(d); return acc; }, []).length;
  const waterPct = Math.min(100, Math.round((state.water.today / state.profile.waterGoal) * 100));
  const rank = getRank(state.xp);

}

const logWater = (amount) => {
  const wasBelow = (state.water.today || 0) < state.profile.waterGoal;
  state.water.today = (state.water.today || 0) + amount;
  state.water.lastReminder = Date.now();
  state.water.lastDate = new Date().toDateString();

  // Save to waterLog history
  state.waterLog = state.waterLog || [];
  const todayStr = new Date().toDateString();
  const idx = state.waterLog.findIndex(w => w.date === todayStr);
  if (idx >= 0) state.waterLog[idx].ml = state.water.today;
  else state.waterLog.push({ date: todayStr, ml: state.water.today });

  save(state);
  const justHit = wasBelow && state.water.today >= state.profile.waterGoal;
  if (justHit) {
    completeQuest("water");
    showGoalHit({ icon: "💧", title: "Hydrated!", subtitle: "You hit your daily water goal", color: "#ffffff" });
  }
  render();
};

const addFoodEntry = (entry) => {
  const todayStr = new Date().toDateString();
  const todayKcalBefore = state.food
    .filter(f => new Date(f.date).toDateString() === todayStr)
    .reduce((a, f) => a + (f.totalKcal || 0), 0);
  const targets = calcMacroTargets(state.profile);
  const wasBelow = todayKcalBefore < targets.kcal * 0.95;
  state.food.push(entry);
  const todayKcalAfter = todayKcalBefore + (entry.totalKcal || 0);
  const justHit = wasBelow && todayKcalAfter >= targets.kcal * 0.95 && todayKcalAfter <= targets.kcal * 1.10;
  save(state);
  if (justHit) {
    showGoalHit({ icon: "🍽️", title: "Fueled!", subtitle: "You hit your daily calorie goal", color: "#ff5451" });
  }
};

// ============ WORKOUT ============
let workoutState = null;
let restTimerInterval = null;
let wakeLock = null;

// ---- Smart initial weight suggestion ----
const getInitialWeight = (exerciseName, group, intensityMult = 1.0) => {
  const prev = state.history.filter(h => h.exercise === exerciseName);
  if (prev.length > 0) {
    const last = prev[prev.length - 1];
    if (last.sets && last.sets.length > 0) {
      const avg = last.sets.reduce((a, s) => a + (s.weight || 0), 0) / last.sets.length;
      // Apply intensity multiplier to last session weight
      return Math.max(2.5, Math.round((avg * intensityMult) / 2.5) * 2.5);
    }
  }
  const bw = state.profile?.weight || 70;
  const goal = state.profile?.goal || "built";
  const goalMap = { lean: 0.3, built: 0.35, ripped: 0.28, jacked: 0.4, strong: 0.45 };
  const base = bw * (goalMap[goal] || 0.35) * intensityMult;
  return Math.max(2.5, Math.round(base / 2.5) * 2.5);
};

const getInitialReps = () => {
  const goal = state.profile?.goal || "built";
  const repMap = { lean: 12, built: 10, ripped: 12, jacked: 8, strong: 5 };
  return repMap[goal] || 10;
};

const getRecentHistory = (exerciseName) => {
  return state.history
    .filter(h => h.exercise === exerciseName && h.sets?.length > 0)
    .slice(-3).reverse()
    .map(h => ({
      date: h.date,
      avgWeight: +(h.sets.reduce((a, s) => a + (s.weight || 0), 0) / h.sets.length).toFixed(1),
      maxReps: Math.max(...h.sets.map(s => s.reps || 0)),
    }));
};

const requestWakeLock = async () => {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
};
const releaseWakeLock = () => {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch {}
};

let restRemaining = 0;
function startRestTimer(seconds, onDone) {
  clearInterval(restTimerInterval);
  restRemaining = seconds;
  renderRestTimer(restRemaining, seconds, onDone);
  restTimerInterval = setInterval(() => {
    restRemaining--;
    if (restRemaining <= 0) {
      clearInterval(restTimerInterval);
      buzz();
      const ring = document.querySelector(".rest-ring-wrap");
      if (ring) ring.remove();
      onDone();
    } else {
      updateRestTimer(restRemaining, seconds);
    }
  }, 1000);
}

function renderRestTimer(remaining, total, onDone) {
  const existing = document.querySelector(".rest-ring-wrap");
  if (existing) existing.remove();
  const wrap = document.createElement("div");
  wrap.className = "rest-ring-wrap";
  const circ = 2 * Math.PI * 80;
  wrap.innerHTML = `
    <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:32px;">
      <svg class="rest-ring-svg" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
        <circle cx="90" cy="90" r="80" fill="none" stroke="var(--accent)"
          stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${circ.toFixed(1)}"
          stroke-dashoffset="${(circ * (1 - remaining/total)).toFixed(1)}"
          id="rest-arc" style="transition:stroke-dashoffset 0.9s linear;"/>
      </svg>
      <div style="position:absolute;text-align:center;">
        <div class="rest-label" id="rest-num">${remaining}</div>
        <div class="rest-sublabel">rest</div>
      </div>
    </div>
    <div class="small muted mb-2" style="text-align:center;">Next set starts automatically</div>
    <div style="display:flex;gap:10px;width:280px;">
      <button class="btn ghost" id="skip-rest" style="flex:1;padding:14px 0;font-size:13px;box-shadow:none;">Skip</button>
      <button class="btn" id="add-rest" style="flex:1;padding:14px 0;font-size:13px;">+30s</button>
    </div>
  `;
  $app.appendChild(wrap);
  document.getElementById("skip-rest").onclick = () => {
    clearInterval(restTimerInterval); wrap.remove(); onDone();
  };
  document.getElementById("add-rest").onclick = () => { tap(); restRemaining += 30; };
}

function updateRestTimer(remaining, total) {
  const num = document.getElementById("rest-num");
  if (num) num.textContent = remaining;
  const arc = document.getElementById("rest-arc");
  if (arc) {
    const circ = 2 * Math.PI * 80;
    arc.setAttribute("stroke-dashoffset", (circ * (1 - remaining / total)).toFixed(1));
  }
}

        <button class="back-btn" id="back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>

      const r = getInitialReps();
      return Array.from({ length: ex.sets }, () => ({
        weight: w, reps: r,

        s.weight = Math.max(0, +(s.weight + dir * step).toFixed(2));
        const wv = document.getElementById(`wval-${sIdx}`);
        if (wv) wv.textContent = s.weight % 1 === 0 ? s.weight : s.weight.toFixed(1);
        // Cascade to future untouched sets
        for (let j = sIdx + 1; j < sets.length; j++) {
          if (!workoutState.logs[exIdx][j].done && !workoutState.logs[exIdx][j]._touched) {
            workoutState.logs[exIdx][j].weight = s.weight;
            const el = document.getElementById(`wval-${j}`);
            if (el) el.textContent = s.weight % 1 === 0 ? s.weight : s.weight.toFixed(1);
          }
        }
        s._touched = true;
      } else if (field === "reps") {
        s.reps = Math.max(1, s.reps + dir);
        const rv = document.getElementById(`rval-${sIdx}`);
        if (rv) rv.textContent = s.reps;
        s._touched = true;
      } else if (field === "rir") {
        s.rir = Math.max(0, Math.min(5, s.rir + dir));
        const rv = document.getElementById(`rirval-${sIdx}`);
        if (rv) rv.textContent = s.rir;
        s._touched = true;
      }
    };
  });

  const doneBtnEl = document.getElementById("done-set"); if (doneBtnEl) doneBtnEl.onclick = () => {
    if (allDone) return;
    if (activeSet >= sets.length) return; // guard
    tap();
    const s = workoutState.logs[exIdx][activeSet];
    if (!s) return; // guard
    s.done = true;
    if (suggestion.lastWeight && s.weight > suggestion.lastWeight) workoutState.beatLastWeight = true;
    const nextUndone = sets.findIndex((x, i) => !x.done && i > activeSet);
    if (nextUndone >= 0) {
      // Pre-fill next set from this one
      if (!workoutState.logs[exIdx][nextUndone]._touched) {
        workoutState.logs[exIdx][nextUndone].weight = s.weight;
        workoutState.logs[exIdx][nextUndone].reps = s.reps;
      }
      workoutState.activeSet = nextUndone;
      // Only start rest timer if enabled in settings
      if (state.restTimerEnabled !== false) {
        startRestTimer(state.defaultRestTime || restSecs, () => renderWorkout());
      } else {
        renderWorkout();
      }
    } else {
      workoutState.activeSet = sets.length;
      renderWorkout();
    }
  };

  const nextBtn2 = document.getElementById("next-ex"); if (nextBtn2) nextBtn2.onclick = () => {
    tap(); stopSetTimer();
    if (exIdx < workoutState.plan.exercises.length - 1) {
      workoutState.exIdx++; workoutState.activeSet = 0; render();
    } else { finishWorkout(); }
  };

  // Set timer buttons
  const stBtn = document.getElementById("set-timer-start");
  if (stBtn) stBtn.onclick = () => { tap(); startSetTimer(state.setTimerDuration || 45); };
  const stStop = document.getElementById("set-timer-stop");
  if (stStop) stStop.onclick = () => { tap(); stopSetTimer(); };
}

function finishWorkout() {
  buzz(); releaseWakeLock(); clearInterval(restTimerInterval);
  if (typeof setTimerInterval !== "undefined") clearInterval(setTimerInterval);
  const sessionLogs = workoutState.plan.exercises.map((e, i) => ({
    exercise: e.name, group: e.group, targetReps: e.targetReps,
    sets: (workoutState.logs[i] || []).filter(s => s.done),
    date: Date.now(),
  })).filter(s => s.sets.length > 0);
  state.history = [...state.history, ...sessionLogs];
  save(state);
  const totalVol = sessionLogs.reduce((a, s) => a + s.sets.reduce((b, x) => b + (x.weight || 0) * (x.reps || 0), 0), 0);
  const xpEarned = Math.round(totalVol / 20);
  completeQuest("workout");
  const allDone = workoutState.plan.exercises.every((_, i) => workoutState.logs[i].every(s => s.done));
  if (allDone) completeQuest("all_sets");
  if (workoutState.beatLastWeight) completeQuest("pr");
  addXP(xpEarned, `Workout complete &middot; ${Math.round(totalVol)}kg lifted`);
  updateStreak();
  workoutState = null; view = "home"; render();
  setTimeout(() => confettiBurst(), 200);
}

// ---- Swap exercise mid-workout ----
function openSwapSheet(currentEx) {
  // Build alternatives: direct alts first, then rest of same group
  const poolEntry = EX_POOL[currentEx.name];
  const directAlts = (poolEntry?.alts || []).filter(n => EX_POOL[n] && n !== currentEx.name);
  const sameGroup = Object.keys(EX_POOL)
    .filter(n => EX_POOL[n].group === currentEx.group && n !== currentEx.name && !directAlts.includes(n));
  const allAlts = [...directAlts, ...sameGroup];

  const tagHTML = (name) => {
    const tags = EX_POOL[name]?.tags || [];
    return tags.map(t => `<span class="tag ${t === "no-equip" ? "no-equip" : t === "harder" ? "harder" : t === "easier" ? "easier" : t === "compound" ? "compound" : ""}">${t}</span>`).join(" ");
  };

  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <h2 class="mb-1">Swap exercise</h2>
    <p class="muted small mb-2">Same muscle group — different equipment or difficulty.</p>

    <div class="label mb-1">Current</div>
    <div class="ex-option current mb-2">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#fff;">${escape(currentEx.name)}</div>
        <div class="row mt-1" style="gap:4px;">${tagHTML(currentEx.name)}</div>
      </div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:0.1em;">CURRENT</span>
    </div>

    <div class="label mb-1">Alternatives</div>
    ${allAlts.length === 0
      ? `<div class="small muted" style="padding:12px 0;">No alternatives found in database for this exercise.</div>`
      : allAlts.map(name => `
        <button class="ex-option" data-swap="${escape(name)}" style="cursor:pointer;width:100%;text-align:left;margin-bottom:4px;">
          <div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escape(name)}</div>
            <div class="row mt-1" style="gap:4px;">${tagHTML(name)}</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      `).join("")}

    <button class="btn outline mt-2" id="close-sheet">Cancel</button>
  `;
  $app.appendChild(sheet);

  document.getElementById("close-sheet").onclick = () => sheet.remove();

  sheet.querySelectorAll("[data-swap]").forEach(b => b.onclick = () => {
    tap();
    const newName = b.dataset.swap;
    // Swap the exercise in workoutState — keep sets/reps/rest, just change the name
    const exIdx = workoutState.exIdx;
    workoutState.plan.exercises[exIdx] = {
      ...workoutState.plan.exercises[exIdx],
      name: newName,
    };
    // Re-init sets with smart weight for the new exercise
    const newWeight = getInitialWeight(newName, workoutState.plan.exercises[exIdx].group);
    workoutState.logs[exIdx] = workoutState.logs[exIdx].map(s =>
      s.done ? s : { ...s, weight: newWeight, _touched: false }
    );
    sheet.remove();
    renderWorkout();
  });
}

    const avgW = s.sets.reduce((a, x) => a + (x.weight || 0), 0) / s.sets.length;

  });

  // Total volume per session for chart
  const sessionsByDay = {};
  state.history.forEach(s => {
    const d = new Date(s.date).toDateString();
    sessionsByDay[d] = (sessionsByDay[d] || 0) + s.sets.reduce((a, x) => a + (x.weight || 0) * (x.reps || 0), 0);

        <div class="col">
          ${Object.entries(exMap).map(([name, sessions], idx) => {
            const first = sessions[0]; const last = sessions[sessions.length - 1];

                  <div>
                    <div style="font-weight:600;font-size:14px;">${escape(name)}</div>

                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:18px;font-weight:600;">${Math.round(last.avgW)} kg</div>
                    ${diff !== 0 ? `<div class="small" style="color:${diff > 0 ? "var(--success)" : "var(--gold)"};">${diff > 0 ? "↑" : "↓"} ${Math.abs(Math.round(diff))}kg (${pct}%)</div>` : ""}
                  </div>

                <div class="chart-box" style="height:100px;"><canvas id="ex-chart-${idx}"></canvas></div>

    state.cardio = state.cardio.filter(c => c.date !== +b.dataset.rmCardio);
    save(state); render();
  });

  document.getElementById("cardio-save").onclick = () => {
    if (!sel.type) return;
    tap();
    const t = CARDIO_TYPES.find(x => x.id === sel.type);
    // calories = METs × intensity-mult × weight-kg × hours
    const kcal = Math.round(t.mets * sel.intensity * state.profile.weight * (sel.duration / 60));
    state.cardio.push({
      date: Date.now(), type: sel.type,
      duration: sel.duration, distance: sel.distance || null,
      intensity: sel.intensity, calories: kcal,
    });
    save(state);
    completeQuest("cardio");
    addXP(Math.round(kcal / 10), "Cardio logged");
    render();
  };
}

  // Live typeahead suggestions while user types
  const $input = document.getElementById("food-input");
  const $sugg = document.getElementById("food-suggestions");
  $input.addEventListener("input", () => {
    const v = $input.value.trim();
    // Get the last chunk after a comma/and/with for suggestions
    const lastChunk = v.split(/,|\sand\s|\swith\s|\+|\n|&/i).pop().trim();
    // Strip leading qty so we suggest on the food name only
    const stripped = lastChunk.replace(/^(\d+\.?\d*|\d+\/\d+|half|quarter|one|two|three|four|five|a|an)\s+(g|gm|gms|grams?|ml|cup|cups|plate|plates|piece|pieces|pcs|bowl|bowls|glass|glasses|tbsp|tsp|small|medium|large|big)?\s*/i, "");
    if (stripped.length < 2) { $sugg.style.display = "none"; $sugg.innerHTML = ""; return; }
    const matches = searchFoods(stripped, 6);
    if (matches.length === 0) { $sugg.style.display = "none"; $sugg.innerHTML = ""; return; }
    $sugg.style.display = "block";
    $sugg.innerHTML = matches.map(m => `<button class="pill" data-suggest="${escape(m.aliases[0])}" style="margin:2px;">${escape(m.name)} · ${m.kcal} kcal/${m.unit}</button>`).join("");
    $sugg.querySelectorAll("[data-suggest]").forEach(b => b.onclick = () => {
      tap();
      // Replace last chunk with the suggested alias
      const parts = v.split(/(?=,|\sand\s|\swith\s|\+|\n|&)/i);
      const lastIdx = parts.length - 1;
      // Preserve prefix before the food name (qty/unit part)
      const lastPart = parts[lastIdx];
      const prefixMatch = lastPart.match(/^(.*?)((?:\d+\.?\d*|\d+\/\d+|half|quarter|one|two|three|four|five|a|an)\s+(?:g|gm|gms|grams?|ml|cup|cups|plate|plates|piece|pieces|pcs|bowl|bowls|glass|glasses|tbsp|tsp|small|medium|large|big)?\s*)?(.*)$/i);
      const sep = prefixMatch ? prefixMatch[1] : "";
      const qtyPart = prefixMatch && prefixMatch[2] ? prefixMatch[2] : "";
      parts[lastIdx] = sep + qtyPart + b.dataset.suggest;
      $input.value = parts.join("");
      $sugg.style.display = "none"; $sugg.innerHTML = "";
      $input.focus();
    });
  });

  document.getElementById("food-go").onclick = () => {
    const txt = document.getElementById("food-input").value.trim();
    if (!txt) return;
    tap();
    const items = parseFoodInput(txt);
    if (items.length === 0) {
      showToast("Couldn't parse — try '2 rotis' or '1 cup rice'", "danger");
      return;
    }
    showFoodConfirm(items, txt);
  };

  // Manual entry button
  document.getElementById("manual-entry").onclick = () => { tap(); openManualEntry(); };
  // Photo scan button
  document.getElementById("photo-scan").onclick = () => { tap(); openPhotoScan(); };

  // Custom food library handlers
  $app.querySelectorAll("[data-add-custom]").forEach(b => b.onclick = () => {
    tap();
    const id = b.dataset.addCustom;
    const c = state.customFoods.find(x => x.id === id);
    if (!c) return;
    // Show qty picker for custom food
    openCustomQtyPicker(c);
  });
  $app.querySelectorAll("[data-edit-custom]").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); tap();
    const id = b.dataset.editCustom;
    const c = state.customFoods.find(x => x.id === id);
    if (c) openManualEntry(c);
  });
  $app.querySelectorAll("[data-rm-custom]").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); tap();
    if (!confirm("Remove this saved food?")) return;
    state.customFoods = state.customFoods.filter(x => x.id !== b.dataset.rmCustom);
    save(state); rebuildFoodIndex(); render();
  });
}

function showFoodConfirm(items, originalText) {
  const totalKcal = items.reduce((a, x) => a + (x.kcal || 0), 0);
  const totalP = items.reduce((a, x) => a + (x.protein || 0), 0);
  const totalC = items.reduce((a, x) => a + (x.carbs || 0), 0);
  const totalF = items.reduce((a, x) => a + (x.fat || 0), 0);

  const unmatched = items.filter(it => it.unmatched);
  const matched = items.filter(it => !it.unmatched);

  const m = document.createElement("div");
  m.className = "modal-bg";
  m.innerHTML = `
    <div class="modal left-aligned">
      <div class="label mb-1">Calculated</div>
      <div style="font-size:32px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px;">${totalKcal} kcal</div>
      <div class="row mb-2" style="gap:14px;font-size:12px;color:var(--text-2);">
        <span><strong style="color:var(--success);">P</strong> ${Math.round(totalP)}g</span>
        <span><strong style="color:var(--accent);">C</strong> ${Math.round(totalC)}g</span>
        <span><strong style="color:var(--gold);">F</strong> ${Math.round(totalF)}g</span>
      </div>
      <div class="label mb-1">Items</div>
      <div class="col mb-2" style="max-height:240px;overflow-y:auto;">
        ${matched.map(it => `
          <div class="food-row">
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:500;">${escape(it.name)}</div>
              ${it.qty ? `<div class="tiny muted">${escape(it.qty)}</div>` : ""}
            </div>
            <div class="small" style="font-weight:600;">${it.kcal} kcal</div>
          </div>
        `).join("")}
        ${unmatched.length > 0 ? `
          <div class="card" style="background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.2);padding:10px;margin-top:6px;">
            <div class="tiny" style="color:var(--danger);font-weight:600;margin-bottom:4px;">⚠️ Not in database</div>
            ${unmatched.map(it => `<div class="tiny muted">${escape(it.name)}</div>`).join("")}
            <div class="tiny muted mt-1">Try a more common name, or skip these for now.</div>
          </div>
        ` : ""}
      </div>
      <div class="row" style="gap:6px;">
        <button class="btn outline" id="food-cancel" style="flex:1;">Cancel</button>
        <button class="btn" id="food-save" style="flex:1;" ${matched.length === 0 ? "disabled" : ""}>Save</button>
      </div>
    </div>
  `;
  $app.appendChild(m);
  document.getElementById("food-cancel").onclick = () => m.remove();
  if (matched.length > 0) {
    document.getElementById("food-save").onclick = () => {
      tap();
      addFoodEntry({
        date: Date.now(), originalText, items: matched,
        totalKcal, totalProtein: totalP, totalCarbs: totalC, totalFat: totalF,
      });
      completeQuest("food");
      addXP(15, "Meal logged");
      m.remove();
      const inp = document.getElementById("food-input");
      if (inp) inp.value = "";
      render();
    };
  }
}

// ============ MANUAL ENTRY MODAL ============
function openManualEntry(existing) {
  const isEdit = !!existing;
  const data = existing ? { ...existing } : {
    id: "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    name: "", unit: "serving", kcal: 0, p: 0, c: 0, f: 0, source: "manual",
  };

  const m = document.createElement("div");
  m.className = "modal-bg";
  m.innerHTML = `
    <div class="modal left-aligned">
      <div class="between mb-2">
        <h2 style="font-size:18px;">${isEdit ? "Edit food" : "Add custom food"}</h2>
        <button id="me-close" style="color:var(--text-3);font-size:22px;line-height:1;">×</button>
      </div>

      <div class="mb-2">
        <div class="label mb-1">Name</div>
        <input class="input" id="me-name" placeholder="e.g. Mom's special chicken" value="${escape(data.name)}">
      </div>

      <div class="mb-2">
        <div class="label mb-1">Per serving size</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
          ${["serving","piece","cup","plate","100g","glass","tbsp","bowl"].map(u => `<button class="pill ${data.unit === u ? "active" : ""}" data-me-unit="${u}" style="padding:8px 4px;font-size:11px;justify-content:center;">${u}</button>`).join("")}
        </div>
      </div>

      <div class="mb-2">
        <div class="label mb-1">Calories</div>
        <input class="input" id="me-kcal" type="number" min="0" step="1" value="${data.kcal || ""}" placeholder="kcal">
      </div>

      <div class="label mb-1">Macros (optional, in grams)</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem;">
        <div>
          <input class="input" id="me-p" type="number" min="0" step="0.1" value="${data.p || ""}" placeholder="P">
          <div class="tiny muted mt-1" style="text-align:center;">Protein</div>
        </div>
        <div>
          <input class="input" id="me-c" type="number" min="0" step="0.1" value="${data.c || ""}" placeholder="C">
          <div class="tiny muted mt-1" style="text-align:center;">Carbs</div>
        </div>
        <div>
          <input class="input" id="me-f" type="number" min="0" step="0.1" value="${data.f || ""}" placeholder="F">
          <div class="tiny muted mt-1" style="text-align:center;">Fat</div>
        </div>
      </div>

      <div class="row" style="gap:6px;">
        <button class="btn outline" id="me-cancel" style="flex:1;">Cancel</button>
        <button class="btn" id="me-save" style="flex:1;">${isEdit ? "Update" : "Save & log"}</button>
      </div>
      <button class="btn ghost" id="me-save-only" style="margin-top:6px;background:var(--surface-2);font-size:13px;padding:10px;">${isEdit ? "Save changes only" : "Save to library only"}</button>
    </div>
  `;
  $app.appendChild(m);

  const get = () => ({
    id: data.id,
    name: document.getElementById("me-name").value.trim(),
    unit: data.unit,
    kcal: +document.getElementById("me-kcal").value || 0,
    p: +document.getElementById("me-p").value || 0,
    c: +document.getElementById("me-c").value || 0,
    f: +document.getElementById("me-f").value || 0,
    source: data.source || "manual",
  });

  m.querySelectorAll("[data-me-unit]").forEach(b => b.onclick = () => {
    tap(); data.unit = b.dataset.meUnit;
    m.querySelectorAll("[data-me-unit]").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  });

  const close = () => m.remove();
  document.getElementById("me-close").onclick = close;
  document.getElementById("me-cancel").onclick = close;

  const validate = (food) => {
    if (!food.name) { showToast("Name is required", "danger"); return false; }
    if (!food.kcal || food.kcal <= 0) { showToast("Enter calories", "danger"); return false; }
    return true;
  };

  const persistCustom = (food) => {
    const idx = state.customFoods.findIndex(x => x.id === food.id);
    if (idx >= 0) state.customFoods[idx] = food;
    else state.customFoods.push(food);
    save(state); rebuildFoodIndex();
  };

  document.getElementById("me-save").onclick = () => {
    const food = get();
    if (!validate(food)) return;
    tap();
    persistCustom(food);
    // also log it now (1 serving)
    const items = [{ name: food.name, qty: "1 " + food.unit, kcal: food.kcal, protein: food.p, carbs: food.c, fat: food.f }];
    addFoodEntry({
      date: Date.now(), originalText: food.name, items,
      totalKcal: food.kcal, totalProtein: food.p, totalCarbs: food.c, totalFat: food.f,
    });
    completeQuest("food");
    addXP(20, "Custom food logged");
    close(); render();
  };
  document.getElementById("me-save-only").onclick = () => {
    const food = get();
    if (!validate(food)) return;
    tap();
    persistCustom(food);
    showToast(isEdit ? "Updated" : "Saved to library", "success");
    close(); render();
  };
}

// ============ QTY PICKER FOR SAVED CUSTOM FOOD ============

  let qty = 1;
  const m = document.createElement("div");
  m.className = "modal-bg";
  const renderModal = () => {
    m.innerHTML = `
      <div class="modal">
        <div class="label mb-1">Add to today</div>
        <h2 style="font-size:20px;margin-bottom:4px;">${escape(food.name)}</h2>

        <div class="label mb-1">How many?</div>
        <div class="row" style="justify-content:center;gap:14px;margin:1rem 0;">
          <button class="stepper-btn" id="qm-minus" style="width:48px;height:48px;border-radius:50%;background:var(--surface-2);font-size:24px;font-weight:300;">−</button>
          <div style="font-size:36px;font-weight:600;letter-spacing:-0.02em;min-width:80px;">${qty % 1 === 0 ? qty : qty.toFixed(2)}</div>
          <button class="stepper-btn" id="qm-plus" style="width:48px;height:48px;border-radius:50%;background:var(--surface-2);font-size:24px;font-weight:300;">+</button>
        </div>
        <div class="row" style="justify-content:center;gap:6px;margin-bottom:1rem;">
          ${[0.25,0.5,0.75,1,1.5,2].map(q => `<button class="pill ${qty === q ? "active" : ""}" data-qm-q="${q}" style="font-size:11px;">${q === 0.25 ? "¼" : q === 0.5 ? "½" : q === 0.75 ? "¾" : q}</button>`).join("")}
        </div>

        <div class="card mb-2" style="padding:12px;">
          <div class="row" style="justify-content:space-around;font-size:12px;">
            <div style="text-align:center;"><div style="font-size:18px;font-weight:600;">${Math.round(food.kcal * qty)}</div><div class="tiny muted">kcal</div></div>
            <div style="text-align:center;"><div style="font-size:18px;font-weight:600;color:var(--success);">${(food.p * qty).toFixed(1)}g</div><div class="tiny muted">P</div></div>
            <div style="text-align:center;"><div style="font-size:18px;font-weight:600;color:var(--accent);">${(food.c * qty).toFixed(1)}g</div><div class="tiny muted">C</div></div>
            <div style="text-align:center;"><div style="font-size:18px;font-weight:600;color:var(--gold);">${(food.f * qty).toFixed(1)}g</div><div class="tiny muted">F</div></div>
          </div>
        </div>

        <div class="row" style="gap:6px;">
          <button class="btn outline" id="qm-cancel" style="flex:1;">Cancel</button>
          <button class="btn" id="qm-add" style="flex:1;">Add</button>
        </div>
      </div>
    `;
    document.getElementById("qm-minus").onclick = () => { tap(); qty = Math.max(0.25, +(qty - 0.25).toFixed(2)); renderModal(); };
    document.getElementById("qm-plus").onclick = () => { tap(); qty = +(qty + 0.25).toFixed(2); renderModal(); };
    m.querySelectorAll("[data-qm-q]").forEach(b => b.onclick = () => { tap(); qty = +b.dataset.qmQ; renderModal(); });
    document.getElementById("qm-cancel").onclick = () => m.remove();
    document.getElementById("qm-add").onclick = () => {
      tap();
      const items = [{
        name: food.name,
        qty: (qty % 1 === 0 ? qty : qty.toFixed(2)) + " " + (food.unit || "serving"),
        kcal: Math.round(food.kcal * qty),
        protein: +(food.p * qty).toFixed(1),
        carbs: +(food.c * qty).toFixed(1),
        fat: +(food.f * qty).toFixed(1),
      }];
      addFoodEntry({
        date: Date.now(), originalText: food.name, items,
        totalKcal: items[0].kcal, totalProtein: items[0].protein,
        totalCarbs: items[0].carbs, totalFat: items[0].fat,
      });
      completeQuest("food");
      addXP(15, "Logged " + food.name);
      m.remove(); render();
    };
  };
  renderModal();
  $app.appendChild(m);
}

      state.customFoods.push(food); rebuildFoodIndex();
      const items = [{ name: food.name, qty: "1 " + food.unit, kcal: food.kcal, protein: food.p, carbs: food.c, fat: food.f }];
      addFoodEntry({
        date: Date.now(), originalText: food.name, items,
        totalKcal: food.kcal, totalProtein: food.p, totalCarbs: food.c, totalFat: food.f,
      });
      completeQuest("food");
      addXP(25, "Scanned & logged " + food.name);
      close(); render();
    };
  };
}

// ============ AI VISION SCAN ============
async function aiScanLabel(base64, mediaType) {
  if (!state.apiKey) return { error: "No API key set" };
  try {
    const prompt = `You are reading a food product nutrition label. Extract the values for ONE serving.
Reply with ONLY valid JSON, no markdown, no preamble:
{"name":"product name","unit":"serving|piece|100g|cup|plate|glass","kcal":number,"p":protein_grams,"c":carbs_grams,"f":fat_grams}
If a value isn't visible, use 0. The "name" should be brief — brand + product if both visible.`;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": state.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5",
        max_tokens: 400,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType || "image/jpeg", data: base64 } },
            { type: "text", text: prompt },
          ],
        }],
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      return { error: `API error ${res.status}: ${err.slice(0, 80)}` };
    }
    const data = await res.json();
    const reply = data.content?.[0]?.text || "";
    const jsonMatch = reply.match(/\{[\s\S]*\}/);
    if (!jsonMatch) return { error: "AI response unparseable" };
    return JSON.parse(jsonMatch[0]);
  } catch (e) {
    return { error: "Network error: " + e.message };
  }
}

// ============ LOCAL OCR (Tesseract.js, lazy-loaded) ============
let tesseractLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("Failed to load OCR library — check internet"));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}

async function ocrScanLabel(dataUrl, onProgress) {
  if (!window.Tesseract) throw new Error("OCR not loaded");
  const result = await window.Tesseract.recognize(dataUrl, "eng", {
    logger: (m) => {
      if (m.status === "recognizing text" && onProgress) {
        onProgress(`Reading text… ${Math.round(m.progress * 100)}%`);
      }
    },
  });
  const raw = result.data.text || "";
  // Heuristic parsing of nutrition label text
  return parseNutritionText(raw);
}

function parseNutritionText(text) {
  const lower = text.toLowerCase();
  const result = { name: "", unit: "serving", kcal: 0, p: 0, c: 0, f: 0, raw: text };

  // Calories
  const kcalRegexes = [
    /(?:energy|calories|kcal|cal|energy value)[^\d]*(\d+(?:\.\d+)?)\s*(?:kcal|cal|kj)?/i,
    /(\d+(?:\.\d+)?)\s*(?:kcal|cal)\b/i,
  ];
  for (const r of kcalRegexes) {
    const m = lower.match(r);
    if (m) {
      let val = parseFloat(m[1]);
      // If we matched a kJ value (typical >500 for serving), convert
      if (/kj/i.test(m[0]) && val > 200) val = val / 4.184;
      result.kcal = Math.round(val);
      break;
    }
  }

  // Protein
  const pMatch = lower.match(/protein[^\d]*(\d+(?:\.\d+)?)\s*g/i);
  if (pMatch) result.p = parseFloat(pMatch[1]);

  // Carbs
  const cMatch = lower.match(/(?:carbohydrates?|carbs|total carb)[^\d]*(\d+(?:\.\d+)?)\s*g/i);
  if (cMatch) result.c = parseFloat(cMatch[1]);

  // Fat (avoid matching "saturated fat" or "trans fat" first)
  const fMatch = lower.match(/(?:^|\n|\s)(?:total fat|fat)[^\d]*?(\d+(?:\.\d+)?)\s*g/i);
  if (fMatch) result.f = parseFloat(fMatch[1]);

  // Per (serving size hint)
  if (/per\s*100\s*g/i.test(lower)) result.unit = "100g";
  else if (/per\s*serving/i.test(lower)) result.unit = "serving";
  else if (/per\s*piece/i.test(lower)) result.unit = "piece";

  // Try to grab a name from the first non-numeric line
  const firstLine = text.split("\n").find(l => l.trim().length > 3 && !/^\d/.test(l.trim()) && !/nutrition|facts|per|values|amount|serving/i.test(l));
  if (firstLine) result.name = firstLine.trim().slice(0, 40);

  if (result.kcal === 0 && result.p === 0 && result.c === 0 && result.f === 0) {
    return { error: "Couldn't read nutrition info — try a clearer photo or use AI scan", raw: text };
  }
  return result;
}

  $app.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => {

};

function showXPGain(amount, reason) {

function showToast(msg, type = "info") {
  const colors = {
    info: "linear-gradient(135deg,#1d4ed8,#24a19e)",
    success: "#1a1a1a",
    danger: "linear-gradient(135deg,#b91c1c,#ffb4ab)",

  const t = document.createElement("div");
  t.className = "toast reminder";
  t.style.cssText += `background:${colors[type] || colors.info};color:white;`;
  t.innerHTML = `<div style="flex:1;font-size:14px;">${escape(msg)}</div>`;
  $app.appendChild(t);
  setTimeout(() => t.style.animation = "slideUp 0.4s reverse forwards", 2800);
  setTimeout(() => t.remove(), 3300);
}

// ============ WATER REMINDERS ============
function checkWaterReminder() {
  if (!state.profile) return;
  const now = Date.now();
  const elapsed = now - (state.water.lastReminder || 0);
  if (elapsed > state.profile.reminderFreq * 60 * 1000 && state.water.today < state.profile.waterGoal) {
    showWaterReminder();
    state.water.lastReminder = now;
    save(state);
  }
}

function showWaterReminder() {
  if (document.querySelector(".reminder")) return;
  const r = document.createElement("div");
  r.className = "reminder";
  r.innerHTML = `
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>
    <div style="flex:1;font-size:14px;">Time to drink ${state.profile.containerSize}ml</div>
    <button class="btn-sm" id="r-drink" style="background:white;color:#24a19e;font-weight:600;padding:6px 12px;border-radius:8px;">Done</button>
    <button id="r-x" style="padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  `;
  $app.appendChild(r);
  document.getElementById("r-drink").onclick = () => { logWater(state.profile.containerSize); r.remove(); };
  document.getElementById("r-x").onclick = () => r.remove();
}

  });
}

// ============ START ============
// Parallax background scroll effect
let parallaxRAF = null;
window.addEventListener("scroll", () => {
  if (parallaxRAF) return;
  parallaxRAF = requestAnimationFrame(() => {
    const el = document.getElementById("parallax-forge");
    if (el) el.style.transform = `translateX(-50%) translateY(${window.scrollY * 0.3}px)`;
    parallaxRAF = null;
  });
}, { passive: true });

setTimeout(async () => {
  render();

  // First-render-of-the-day welcome
  if (state.profile && state.profile.name) {
    const today = new Date().toDateString();
    if (state.lastWelcomeDate !== today) {
      state.lastWelcomeDate = today;
      save(state);
      setTimeout(() => showWelcomeToast(), 800);
    }
  }

  // Init Google Sign-In (after GIS script loads)
  window.addEventListener("load", () => setTimeout(initGoogleAuth, 500), { once: true });
  if (document.readyState === "complete") setTimeout(initGoogleAuth, 500);
}, 400);

// Set timer per set (optional) — counts down so user knows when to stop
let setTimerInterval = null;
let setTimerRemaining = 0;

function startSetTimer(seconds) {
  clearInterval(setTimerInterval);
  setTimerRemaining = seconds;
  // Update existing display if present
  updateSetTimerDisplay();
  setTimerInterval = setInterval(() => {
    setTimerRemaining--;
    updateSetTimerDisplay();
    if (setTimerRemaining <= 0) {
      clearInterval(setTimerInterval);
      buzz();
    }
  }, 1000);
}

function stopSetTimer() {
  clearInterval(setTimerInterval);
  setTimerRemaining = 0;
  updateSetTimerDisplay();
}

function updateSetTimerDisplay() {
  const el = document.getElementById("set-timer-display");
  if (!el) return;
  if (setTimerRemaining <= 0) {
    el.textContent = "TIME";
    el.style.color = "var(--success)";
  } else {
    const m = Math.floor(setTimerRemaining / 60);
    const s = setTimerRemaining % 60;
    el.textContent = m > 0 ? `${m}:${String(s).padStart(2,"0")}` : `${s}s`;
    el.style.color = setTimerRemaining <= 10 ? "var(--accent)" : "var(--text)";
  }
}

function showWelcomeToast() {
  const t = document.createElement("div");
  t.className = "toast reminder goal-hit";
  t.style.cssText += "background:#1a1a1a;color:#fff;border:1px solid rgba(255,255,255,0.08);";
  t.innerHTML = `
    <div style="font-size:28px;animation:floaty 2s ease-in-out infinite;">👋</div>
    <div style="flex:1;">
      <div style="font-weight:700;font-size:15px;">${getGreeting()}, ${escape(state.profile.name)}</div>
      <div style="font-size:12px;color:#a3a3a3;">Let's make today count.</div>
    </div>
  `;
  $app.appendChild(t);
  setTimeout(() => t.style.animation = "slideUp 0.4s reverse forwards", 3200);
  setTimeout(() => t.remove(), 3700);
}
</script>
